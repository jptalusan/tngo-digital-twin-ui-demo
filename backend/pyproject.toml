[project]
name = "tngo-backend"
version = "0.1.0"
description = "FastAPI backend for GTFS + on-demand planning"
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
  "fastapi>=0.111.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.7.0",
  "sqlalchemy>=2.0.30",
  "psycopg[binary]>=3.1.19",
  "geoalchemy2>=0.15.2",
  "python-dotenv>=1.0.1",
  "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.2.0", "httpx>=0.27.0"]

[tool.uv]
package = false
