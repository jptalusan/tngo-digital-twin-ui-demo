[project]
name = "tngo-backend"
version = "0.1.0"
description = "FastAPI backend for GTFS + on-demand planning"
requires-python = ">=3.12"
readme = "README.md"
dependencies = [
  "fastapi>=0.111.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.7.0",
  "sqlalchemy>=2.0.30",
  "psycopg[binary]>=3.1.19",
  "geoalchemy2>=0.15.2",
  "python-dotenv~=1.1.1",
  "httpx>=0.27.0",
  "h3>=3.7.7",
  "python-multipart>=0.0.5",
  "pandas>=2.2.3",
  "numpy>=1.26.2",
  "geopandas>=1.0.0",
  "shapely>=2.0.2",
  "osmnx>=1.7.1",
  "networkx>=3.2.1",
  "pyproj>=3.7.0",
  "fiona>=1.9.5",
  "PuLP>=3.1.1",
  "scipy>=1.11.3",
  "tqdm>=4.64.0",
  "requests>=2.31.0",
  "dask>=2023.11.0",
  "dask-geopandas>=0.3.1",
  "psutil>=5.9.6",
  "aiohttp>=3.11.18",
  "scikit-learn>=1.5.0",
  "pyogrio>=0.12.1",
  "fastparquet>=2025.12.0",
  "pyarrow>=12.0.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
  "pytest-cov>=5.0.0",
  "httpx>=0.27.0",
  "ruff>=0.4.0",
]

[dependency-groups]
dev = [
  "pytest>=8.2.0",
  "pytest-cov>=5.0.0",
  "ruff>=0.4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Stop at first failure during development; remove -x for CI full runs.
addopts = "--tb=short"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]   # line length handled by formatter

[tool.uv]
package = false
