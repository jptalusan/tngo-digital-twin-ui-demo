services:
  postgres:
    image: postgis/postgis:18-3.6
    container_name: tngo-postgres
    platform: linux/amd64
    restart: unless-stopped
    shm_size: 128mb
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - transit_pg_data:/var/lib/postgresql

  pgadmin:
    image: dpage/pgadmin4:9.12
    container_name: tngo-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    depends_on:
      - postgres

  osrm:
    image: drogers0/gt_osrm:linux
    container_name: transit_osrm
    profiles:
      - osrm
    ports:
      - "${OSRM_PORT:-5000}:8080"
    volumes:
      - osrm_data:/media
    deploy:
      resources:
        limits:
          memory: 4g
    restart: unless-stopped

volumes:
  transit_pg_data:
  osrm_data:
